<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=Quicksand:wght@700&display=swap">
<style>
/* Simply Silicon hero film. One GPU lights a blue dot, the room goes dark, the dot crosses the dark and opens a full-screen chat. */
:root {
  --ink: #f4f4f5; --ink-2: #b4b4bc; --ink-3: #6f6f78; --accent: #4db2ef;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif; --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; --logo: "Quicksand", Arial, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1); --gut: clamp(20px, 4.4vw, 64px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: #000; }
body { margin: 0; color: var(--ink-2); font: 400 17px/1.6 var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
.wrap { max-width: 1600px; margin-inline: auto; padding-inline: var(--gut); }
.hdr { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); }
.hdr .wrap { height: 76px; display: flex; align-items: center; gap: 24px; }
.logo { font: 700 24px/1 var(--logo); color: var(--accent); text-decoration: none; letter-spacing: -.02em; }
.menu { display: flex; gap: 4px; margin-left: auto; }
.menu a { padding: 8px 14px; color: var(--ink-2); text-decoration: none; font-size: 15px; }
.menu a:first-child { color: var(--ink); }
.btn { display: inline-flex; align-items: center; height: 38px; padding: 0 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,.16); background: transparent; color: var(--ink); font: 500 14px/1 var(--body); text-decoration: none; cursor: pointer; }
.btn--primary { background: var(--ink); border-color: var(--ink); color: #09090b; }
.btn:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 3px; }

.hero { position: relative; height: 100svh; min-height: 600px; max-height: 1200px; overflow: hidden; isolation: isolate; background: #000; }
#film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

/* the chat, opened from the dot */
.chat { position: absolute; inset: 0; z-index: 1; background: #000; clip-path: circle(0px at 50% 50%); }
.col { position: absolute; left: 50%; top: clamp(110px, 16vh, 170px); width: min(720px, calc(100% - 2 * var(--gut))); transform: translateX(-50%); }
.qrow { display: flex; justify-content: flex-end; }
.q { max-width: 80%; padding: 11px 18px; border-radius: 20px; background: #1c1c1f; color: var(--ink); font-size: 17px; line-height: 1.45; opacity: 0; transform: translateY(14px); transition: opacity .5s var(--ease), transform .7s var(--ease); }
.q.on { opacity: 1; transform: none; }
.arow { display: grid; grid-template-columns: 26px 1fr; gap: 14px; margin-top: 28px; }
.av { width: 26px; height: 26px; margin-top: 1px; border-radius: 50%; opacity: 0; transition: opacity .4s; background: radial-gradient(circle, #f2faff 0 3px, rgba(77,178,239,.7) 4.5px, rgba(77,178,239,.18) 8px, transparent 12px); }
.av.on { opacity: 1; }
.av.busy { animation: breathe 1s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.25); } }
#ans { margin: 0; color: #e4e4e8; font-size: 17px; line-height: 1.7; }
.w { opacity: 0; transition: opacity .3s ease; }
.w.on { opacity: 1; }
/* the composer the question is typed into */
.composer { position: absolute; left: 50%; top: 46%; width: min(720px, calc(100% - 2 * var(--gut))); transform: translate(-50%, -50%); padding: 16px 16px 16px 22px; border-radius: 26px; background: #141416; border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px; transition: opacity .45s ease, transform .6s var(--ease); }
.composer.gone { opacity: 0; transform: translate(-50%, -40%); }
.typed { flex: 1; min-height: 27px; color: var(--ink); font-size: 17px; line-height: 27px; white-space: nowrap; overflow: hidden; }
.typed .ph { color: var(--ink-3); }
.caret { display: inline-block; width: 1.5px; height: 20px; margin-left: 1px; vertical-align: -4px; background: var(--accent); animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.send { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #2a2a2e; display: grid; place-items: center; transition: background .25s, transform .25s; }
.send svg { width: 16px; height: 16px; stroke: #8a8a92; transition: stroke .25s; }
.send.ready { background: var(--ink); } .send.ready svg { stroke: #000; }
.send.press { transform: scale(.88); }

.copy { position: absolute; left: 0; right: 0; bottom: clamp(40px, 8vh, 84px); z-index: 3; pointer-events: none; }
h1 { margin: 0; max-width: 9.5em; color: var(--ink); font: 600 clamp(46px, 6.2vw, 104px)/.95 var(--display); letter-spacing: -.045em; animation: rise 1.6s var(--ease) both; }
h1 .stop { color: var(--accent); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.tag { position: absolute; right: var(--gut); bottom: 22px; z-index: 4; display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--ink-3); }
.tag b { color: var(--ink-2); font-weight: 500; }

@media (max-width: 860px) {
  .menu { display: none; } .hdr .btn { margin-left: auto; }
  .col { top: 96px; }
  .q, #ans, .typed { font-size: 15.5px; }
  .arow { grid-template-columns: 22px 1fr; gap: 12px; margin-top: 20px; } .av { width: 22px; height: 22px; }
  .composer { top: 42%; padding: 12px 12px 12px 18px; }
  .copy { bottom: 74px; }
  h1 { font-size: clamp(40px, 11.5vw, 54px); }
  .tag { left: var(--gut); justify-content: space-between; }
  .tag > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
@media (prefers-reduced-motion: reduce) { h1 { animation: none; } }
</style>

<header class="hdr"><div class="wrap">
  <a class="logo" href="#top">simply silicon.</a>
  <nav class="menu" aria-label="Main"><a href="#top">Home</a><a href="#top">Foundation</a><a href="#top">Workloads</a><a href="#top">Platform</a></nav>
  <a class="btn btn--primary" href="#top">Connect</a>
</div></header>

<main id="top">
  <section class="hero" aria-label="Simply Silicon">
    <canvas id="film" aria-hidden="true"></canvas>
    <div class="chat" id="chat">
      <div class="col">
        <div class="qrow"><div class="q" id="q">What is Simply Silicon?</div></div>
        <div class="arow"><span class="av" id="av" aria-hidden="true"></span><p id="ans"></p></div>
      </div>
      <div class="composer" id="composer" aria-hidden="true">
        <div class="typed" id="typed"><span class="ph">Ask anything</span></div>
        <span class="send" id="send"><svg viewBox="0 0 16 16" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></span>
      </div>
    </div>
    <div class="copy"><div class="wrap"><h1>Secure, localized compute at scale<span class="stop">.</span></h1></div></div>
    <div class="tag"><span><b>Hero film {{N}} of 2</b> · {{NAME}}</span><button class="btn" type="button" id="replay">Replay</button></div>
  </section>
</main>
<script>
var ANSWER = {{ANSWER}};
var SHOT = {{SHOT}};
{{JS}}
</script>
